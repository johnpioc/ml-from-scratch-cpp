name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing a pull request for jmll, a from-scratch C++ machine learning library built as a learning project targeting quant developer roles.

            Please review the diff with these priorities:

            1. **Correctness** — are there logic bugs, off-by-one errors, or incorrect numerical handling? For anything involving floating-point math or spatial data structures, be especially careful.
            2. **Modern C++ idioms** — flag uses of raw owning pointers, missing const-correctness, unnecessary copies, or places where RAII would be cleaner. Suggest C++17/20 alternatives where relevant.
            3. **Performance** — call out unnecessary allocations, cache-unfriendly access patterns, or places where move semantics would help. This is a library that cares about speed.
            4. **Testing** — does new code have corresponding tests? Are edge cases covered (empty inputs, single element, high dimensions)?
            5. **API design** — is the public interface (in headers) clean and hard to misuse?

            Be direct and opinionated. Prefer short, specific comments over vague praise. If something looks fine, don't comment on it. If you're not sure about something, say so rather than guessing.

            Respect the rules in CLAUDE.md — in particular, do not suggest full code rewrites for files under /include, /src, or /tests. Point out the issue, explain why, and let the author fix it themselves.
